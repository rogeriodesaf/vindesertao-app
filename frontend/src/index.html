<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Vinde Sertão</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1E4D5C">
    <meta name="description" content="Vinde Sertão — organização, visitas e apoio para equipes em campo.">
    <link rel="canonical" href="https://vindesertao-app.onrender.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Vinde Sertão">
    <meta property="og:title" content="Vinde Sertão">
    <meta property="og:description" content="Organização, visitas e apoio para equipes em campo.">
    <meta property="og:url" content="https://vindesertao-app.onrender.com/">
    <meta property="og:image" content="https://vindesertao-app.onrender.com/assets/logo-vinde-sertao.webp">
    <meta property="og:image:alt" content="Logo Vinde Sertão">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Vinde Sertão">

    <meta name="twitter:image" content="https://vindesertao-app.onrender.com/assets/logo-vinde-sertao.webp">
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('vinde.theme') || 'system';
          const theme = preference === 'light' || preference === 'dark'
            ? preference
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/logo-vinde-sertao.webp">
    <link rel="icon" type="image/webp" href="/assets/logo-vinde-sertao.webp">
  </head>

  </body>
